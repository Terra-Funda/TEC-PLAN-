<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TEC PLAN — Projeto de Tubulação Industrial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f12;--p1:#16191f;--p2:#1c2028;--p3:#232833;--ln:#2a2f39;--tx:#d9dde4;--mu:#8b929e;--am:#f59e0b;--am2:#fbbf24;--ok:#22c55e;--er:#ef4444;--mono:'IBM Plex Mono',Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.4 'IBM Plex Sans',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:grid;grid-template-rows:46px 1fr 26px;height:100%;height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--p1);border-bottom:1px solid var(--ln);min-width:0}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.14em;font-size:14px;white-space:nowrap;user-select:none}
.logo b{color:var(--am)}
.tabs{display:flex;gap:2px;margin-left:8px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;padding:7px 12px;border-radius:6px;color:var(--mu);font-weight:500;white-space:nowrap}
.tabs .sm{display:none}
.tabs button.on{background:var(--p3);color:var(--am)}
.hsp{flex:1}
.ib{background:var(--p2);border:1px solid var(--ln);border-radius:6px;height:30px;min-width:30px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.ib:hover{border-color:#3a404c}
.ib:disabled{opacity:.4}
.ib.am{background:var(--am);color:#111;border-color:var(--am);font-weight:600}
.ib.sm{height:26px;font-size:12px;padding:0 7px}
.mob{display:none}
main{position:relative;display:grid;grid-template-columns:260px 1fr 290px;min-height:0}
main.full{grid-template-columns:1fr}
main.full aside{display:none}
aside{background:var(--p1);overflow-y:auto;min-height:0;scrollbar-width:thin;scrollbar-color:#333 transparent}
aside#left{border-right:1px solid var(--ln)}
aside#right{border-left:1px solid var(--ln)}
.sec{border-bottom:1px solid var(--ln);padding:10px 12px}
.sec h3{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:600;display:flex;align-items:center;justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.cat{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--p2);border:1px solid var(--ln);border-radius:6px;padding:7px 4px;font-size:11px;text-align:center;line-height:1.15}
.cat:hover{border-color:var(--am)}
.cat svg{width:26px;height:26px;stroke:var(--am);fill:none;stroke-width:1.6}
label.f{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mu)}
.in{background:var(--bg);border:1px solid var(--ln);border-radius:5px;padding:5px 7px;height:30px;width:100%;color:var(--tx)}
.in:focus{outline:1px solid var(--am);border-color:var(--am)}
.row{display:flex;gap:6px;align-items:center}
.tree{display:flex;flex-direction:column;gap:2px;max-height:260px;overflow:auto}
.tree button{display:flex;justify-content:space-between;background:none;border:0;padding:4px 6px;border-radius:4px;text-align:left;font-family:var(--mono);font-size:12px;color:var(--tx)}
.tree button:hover{background:var(--p2)}
.tree button.on{background:#3a2a07;color:var(--am2)}
.tree .er{color:var(--er)}
.mut{color:var(--mu);font-size:12px}
.mono{font-family:var(--mono)}
.chip{display:inline-block;padding:1px 6px;border-radius:10px;background:var(--p3);font-size:11px;color:var(--mu)}
.chip.am{background:#3a2a07;color:var(--am2)}.chip.ok{background:#0e2f1a;color:#5ee28f}.chip.er{background:#3b1010;color:#ff8a8a}
#center{position:relative;min-width:0;min-height:0;background:var(--bg)}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
#v3d canvas,#viso canvas{display:block;width:100%;height:100%;touch-action:none}
.ovl{position:absolute;display:flex;gap:4px;flex-wrap:wrap;z-index:2}
.ovl.tl{top:8px;left:8px}.ovl.tr{top:8px;right:8px}.ovl.bl{bottom:8px;left:8px}
.ovl .ib{background:rgba(22,25,31,.92);backdrop-filter:blur(4px)}
.ib.on{border-color:var(--am);color:var(--am)}
.hint{position:absolute;bottom:8px;right:8px;font-size:11px;color:var(--mu);background:rgba(13,15,18,.8);padding:4px 8px;border-radius:5px;max-width:60%;pointer-events:none}
footer{display:flex;align-items:center;gap:14px;padding:0 10px;background:var(--p1);border-top:1px solid var(--ln);font-family:var(--mono);font-size:11px;color:var(--mu);white-space:nowrap;overflow:hidden}
footer .er{color:var(--er)}footer .am{color:var(--am)}
#isobar{position:absolute;top:0;left:0;right:0;display:flex;gap:6px;align-items:center;padding:8px;background:rgba(22,25,31,.95);border-bottom:1px solid var(--ln);overflow-x:auto;z-index:3;scrollbar-width:none}
#isobar>*{flex:none}
#isobar .sep{width:1px;height:22px;background:var(--ln);flex:none}
#isobar select,#isobar input{height:28px;padding:2px 6px;width:auto}
#viso canvas{position:absolute;top:0;left:0}
#isoinfo{position:absolute;left:8px;bottom:8px;font-family:var(--mono);font-size:12px;background:rgba(13,15,18,.85);padding:5px 9px;border-radius:5px;border:1px solid var(--ln);pointer-events:none}
#vsheet,#vbom{overflow:auto}
#sheetbar{position:sticky;top:0;display:flex;gap:6px;align-items:center;padding:8px;background:var(--p1);border-bottom:1px solid var(--ln);z-index:2;flex-wrap:wrap}
#sheetwrap{padding:16px;display:flex;justify-content:center}
#sheetwrap svg{background:#fff;box-shadow:0 4px 30px rgba(0,0,0,.5);height:auto}
#carimbo{display:none;padding:10px;background:var(--p1);border-bottom:1px solid var(--ln)}
#carimbo.on{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.bomw{padding:16px;max-width:1200px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:16px}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:8px;padding:10px 12px}
.card .v{font-family:var(--mono);font-size:20px;color:var(--am2);font-weight:600}
.card .l{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.08em}
table.t{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px}
table.t th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);padding:6px;border-bottom:1px solid var(--ln);background:var(--p1);position:sticky;top:0}
table.t td{padding:5px 6px;border-bottom:1px solid #1d2129;vertical-align:top}
table.t td.n{font-family:var(--mono);text-align:right;white-space:nowrap}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:8px;margin-bottom:18px}
h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:18px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
textarea.code{width:100%;height:220px;background:var(--bg);color:#c8d0dc;border:1px solid var(--ln);border-radius:6px;font:11px/1.4 var(--mono);padding:8px}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:50;pointer-events:none;width:min(92vw,460px)}
.toast{background:#1f242d;border:1px solid var(--ln);border-left:3px solid var(--am);padding:8px 12px;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.4);font-size:12.5px;animation:tin .2s}
.toast.er{border-left-color:var(--er)}.toast.ok{border-left-color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
.btns{display:flex;flex-wrap:wrap;gap:5px}
.btns .ib{flex:1 1 auto}
.ports .pt{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed var(--ln);font-size:12px}
.ports .pt:last-child{border:0}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
.back{display:none}
@media (max-width:767px){
  .mob{display:inline-flex}
  .logo span.full{display:none}
  main,main.full{grid-template-columns:1fr}
  aside{position:absolute;top:0;bottom:0;width:min(86vw,320px);z-index:20;transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.6)}
  aside#left{left:0;transform:translateX(-102%)}
  aside#right{right:0;transform:translateX(102%)}
  aside.open{transform:none!important}
  .back.on{display:block;position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:15}
  .hdr-extra{display:none}
  .tabs button{padding:7px 6px}.tabs{margin-left:2px}
  .tabs .lg{display:none}.tabs .sm{display:inline}
  #bRedo{display:none}
  .hint{display:none}
  header{gap:6px;padding:0 6px}
  #bUndo{display:none}
  #userchip{padding:0 6px}#userchip .chip{display:none}#userchip::before{content:'👤'}
  .dk{display:none!important}.mb{display:inline!important}
  .ovl.tr{top:44px;left:8px;right:auto}
  .ovl .ib.sm{padding:0 6px}
  .mobonly{display:inline-flex!important}
}
.mb,.mobonly{display:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="ib mob" id="bLeft" title="Catálogo">☰</button>
    <div class="logo" id="logo">
      <svg width="24" height="24" viewBox="0 0 24 24"><rect x="1" y="1" width="22" height="22" rx="4" fill="#f59e0b"/><path d="M5 8h14M12 8v11M5 15h4" stroke="#111" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
      <span class="full">TEC <b>PLAN</b></span>
    </div>
    <nav class="tabs" id="tabs">
      <button data-t="3d" class="on">3D</button>

      <button data-t="sheet">Prancha</button>

    <div class="hsp"></div>
    <button class="ib" id="bUndo" title="Desfazer (Ctrl+Z)">↶</button>
    <button class="ib" id="bRedo" title="Refazer (Ctrl+Y)">↷</button>
    <button class="ib hdr-extra" id="bNew" title="Novo projeto">Novo</button>
    <button class="ib mob" id="bRight" title="Propriedades">⚙</button>
  </header>
  <main id="main">
    <aside id="left"></aside>
    <section id="center">
      <div class="view on" id="v3d">
        <div class="ovl tl">
          <button class="ib sm" data-cam="iso">Iso</button><button class="ib sm" data-cam="top">Topo</button><button class="ib sm" data-cam="front">Frente</button><button class="ib sm" data-cam="side">Lado</button><button class="ib sm" id="bFit">Enquadrar</button><button class="ib sm mobonly" id="bUndo2">↶</button>
        </div>
        <div class="ovl tr"><button class="ib sm on" id="bGz" title="Setas para mover e anéis para girar a peça selecionada">Gizmo</button><select class="ib sm" id="gzSnap" title="Encaixe na grade"><option value="10">10 mm</option><option value="50" selected>50 mm</option><option value="100">100 mm</option><option value="500">500 mm</option></select><select class="ib sm" id="gzAng" title="Passo de giro"><option value="5">5°</option><option value="15" selected>15°</option><option value="45">45°</option><option value="90">90°</option></select><button class="ib sm on" id="bPorts">Portas</button><button class="ib sm on" id="bClash">Clash</button></div>
        <div class="hint" id="hint3d">Arraste o fundo: girar a vista · 2 dedos/botão direito: deslocar · pinça/roda: zoom · peça selecionada: puxe as setas para mover e os anéis para girar · esfera âmbar: continuar a linha</div>
      </div>
      <div class="view" id="viso">
        <div id="isobar"></div>
        <canvas id="isoc"></canvas>
        <div id="isoinfo">—</div>
      </div>
      <div class="view" id="vsheet">
        <div id="sheetbar"></div>
        <div id="carimbo"></div>
        <div id="sheetwrap"></div>
      </div>
      <div class="view" id="vbom"><div class="bomw" id="bomw"></div></div>
    </section>
    <aside id="right"></aside>
    <div class="back" id="back"></div>
  </main>
  <footer id="status"></footer>
</div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =====================================================================
 * TEC PLAN — núcleo (sem dependência de Three.js)
 * Coordenadas internas: X = Leste, Y = Elevação (cima), Z = Sul (−Norte)
 * Unidades: mm
 * ===================================================================== */

/* ---------------- Matemática ---------------- */
class V3 {
  constructor(x = 0, y = 0, z = 0) { this.x = x; this.y = y; this.z = z; }
  static of(a) { return new V3(a[0], a[1], a[2]); }
  arr() { return [this.x, this.y, this.z]; }
  clone() { return new V3(this.x, this.y, this.z); }
  add(v) { return new V3(this.x + v.x, this.y + v.y, this.z + v.z); }
  sub(v) { return new V3(this.x - v.x, this.y - v.y, this.z - v.z); }
  scale(s) { return new V3(this.x * s, this.y * s, this.z * s); }
  dot(v) { return this.x * v.x + this.y * v.y + this.z * v.z; }
  cross(v) { return new V3(this.y * v.z - this.z * v.y, this.z * v.x - this.x * v.z, this.x * v.y - this.y * v.x); }
  len() { return Math.hypot(this.x, this.y, this.z); }
  norm() { const l = this.len() || 1; return this.scale(1 / l); }
  dist(v) { return this.sub(v).len(); }
  neg() { return this.scale(-1); }
  lerp(v, t) { return this.add(v.sub(this).scale(t)); }
}
const UP = new V3(0, 1, 0), AX = new V3(1, 0, 0), AZ = new V3(0, 0, 1);

class Q {
  constructor(x = 0, y = 0, z = 0, w = 1) { this.x = x; this.y = y; this.z = z; this.w = w; }
  static of(a) { return new Q(a[0], a[1], a[2], a[3]); }
  arr() { return [this.x, this.y, this.z, this.w]; }
  static axisAngle(axis, ang) {
    const a = axis.norm(), s = Math.sin(ang / 2);
    return new Q(a.x * s, a.y * s, a.z * s, Math.cos(ang / 2));
  }
  mul(b) { // this * b  (aplica b primeiro, depois this)
    const a = this;
    return new Q(
      a.w * b.x + a.x * b.w + a.y * b.z - a.z * b.y,
      a.w * b.y - a.x * b.z + a.y * b.w + a.z * b.x,
      a.w * b.z + a.x * b.y - a.y * b.x + a.z * b.w,
      a.w * b.w - a.x * b.x - a.y * b.y - a.z * b.z);
  }
  conj() { return new Q(-this.x, -this.y, -this.z, this.w); }
  normalize() { const l = Math.hypot(this.x, this.y, this.z, this.w) || 1; return new Q(this.x / l, this.y / l, this.z / l, this.w / l); }
  rot(v) {
    const { x, y, z, w } = this;
    const tx = 2 * (y * v.z - z * v.y), ty = 2 * (z * v.x - x * v.z), tz = 2 * (x * v.y - y * v.x);
    return new V3(v.x + w * tx + (y * tz - z * ty), v.y + w * ty + (z * tx - x * tz), v.z + w * tz + (x * ty - y * tx));
  }
  static fromUnitVectors(a, b) {
    a = a.norm(); b = b.norm();
    const r = a.dot(b) + 1;
    if (r < 1e-8) {
      const ax = Math.abs(a.x) > Math.abs(a.z) ? new V3(-a.y, a.x, 0) : new V3(0, -a.z, a.y);
      return new Q(ax.x, ax.y, ax.z, 0).normalize();
    }
    const c = a.cross(b);
    return new Q(c.x, c.y, c.z, r).normalize();
  }
  // base ortonormal (colunas x,y,z) -> quaternion (algoritmo do three.js)
  static fromBasis(x, y, z) {
    const m11 = x.x, m12 = y.x, m13 = z.x, m21 = x.y, m22 = y.y, m23 = z.y, m31 = x.z, m32 = y.z, m33 = z.z;
    const tr = m11 + m22 + m33; let s;
    if (tr > 0) { s = 0.5 / Math.sqrt(tr + 1); return new Q((m32 - m23) * s, (m13 - m31) * s, (m21 - m12) * s, 0.25 / s).normalize(); }
    if (m11 > m22 && m11 > m33) { s = 2 * Math.sqrt(1 + m11 - m22 - m33); return new Q(0.25 * s, (m12 + m21) / s, (m13 + m31) / s, (m32 - m23) / s).normalize(); }
    if (m22 > m33) { s = 2 * Math.sqrt(1 + m22 - m11 - m33); return new Q((m12 + m21) / s, 0.25 * s, (m23 + m32) / s, (m13 - m31) / s).normalize(); }
    s = 2 * Math.sqrt(1 + m33 - m11 - m22); return new Q((m13 + m31) / s, (m23 + m32) / s, 0.25 * s, (m21 - m12) / s).normalize();
  }
}
const D2R = Math.PI / 180;
const r1 = v => Math.round(v * 10) / 10;

/* ---------------- Catálogo dimensional (ASME, valores Cl.150; 300/600 aproximados) ---------------- */
const DNS = [15, 20, 25, 40, 50, 80, 100, 150, 200, 250, 300];
const DIM = {
  15: { nps: '1/2"', inch: 0.5, od: 21.3, wt: 2.77, tee: 25, red: 38, fod: 89, ft: 11.2, wn: 48, so: 16, bc: 60.3, nb: 4, bd: 12.7, gate: 108, globe: 108, bfly: 33 },
  20: { nps: '3/4"', inch: 0.75, od: 26.7, wt: 2.87, tee: 29, red: 38, fod: 98, ft: 12.7, wn: 52, so: 16, bc: 69.8, nb: 4, bd: 12.7, gate: 117, globe: 117, bfly: 33 },
  25: { nps: '1"', inch: 1, od: 33.4, wt: 3.38, tee: 38, red: 51, fod: 108, ft: 14.3, wn: 56, so: 17.5, bc: 79.4, nb: 4, bd: 12.7, gate: 127, globe: 127, bfly: 33 },
  40: { nps: '1.1/2"', inch: 1.5, od: 48.3, wt: 3.68, tee: 57, red: 64, fod: 127, ft: 17.5, wn: 62, so: 21, bc: 98.4, nb: 4, bd: 12.7, gate: 165, globe: 165, bfly: 33 },
  50: { nps: '2"', inch: 2, od: 60.3, wt: 3.91, tee: 64, red: 76, fod: 152, ft: 19.1, wn: 62, so: 24, bc: 120.7, nb: 4, bd: 15.9, gate: 178, globe: 203, bfly: 43 },
  80: { nps: '3"', inch: 3, od: 88.9, wt: 5.49, tee: 86, red: 89, fod: 191, ft: 23.9, wn: 68, so: 29, bc: 152.4, nb: 4, bd: 15.9, gate: 203, globe: 241, bfly: 46 },
  100: { nps: '4"', inch: 4, od: 114.3, wt: 6.02, tee: 105, red: 102, fod: 229, ft: 23.9, wn: 75, so: 30, bc: 190.5, nb: 8, bd: 15.9, gate: 229, globe: 292, bfly: 52 },
  150: { nps: '6"', inch: 6, od: 168.3, wt: 7.11, tee: 143, red: 140, fod: 279, ft: 25.4, wn: 87, so: 35, bc: 241.3, nb: 8, bd: 19.1, gate: 267, globe: 406, bfly: 56 },
  200: { nps: '8"', inch: 8, od: 219.1, wt: 8.18, tee: 178, red: 152, fod: 343, ft: 28.6, wn: 100, so: 40, bc: 298.5, nb: 8, bd: 19.1, gate: 292, globe: 495, bfly: 60 },
  250: { nps: '10"', inch: 10, od: 273.1, wt: 9.27, tee: 216, red: 178, fod: 406, ft: 30.2, wn: 100, so: 41, bc: 362, nb: 12, bd: 22.2, gate: 330, globe: 622, bfly: 68 },
  300: { nps: '12"', inch: 12, od: 323.9, wt: 9.53, tee: 254, red: 203, fod: 483, ft: 31.8, wn: 113, so: 49, bc: 431.8, nb: 12, bd: 22.2, gate: 356, globe: 698, bfly: 78 },
};
const CLASSES = [150, 300, 600];
const FLANGE_STDS = {
  'ASME B16.5': { 150: 'Cl.150', 300: 'Cl.300', 600: 'Cl.600' },
  'EN 1092-1': { 150: 'PN16', 300: 'PN40', 600: 'PN63' },
  'JIS B2220': { 150: '10K', 300: '20K', 600: '40K' },
};
function flg(dn, cls) {
  const d = DIM[dn], k = { 150: [1, 1, 1], 300: [1.1, 1.35, 1.12], 600: [1.15, 1.7, 1.3] }[cls] || [1, 1, 1];
  let nb = d.nb;
  if (cls > 150) nb = dn <= 40 ? 4 : dn <= 100 ? 8 : dn <= 200 ? 12 : 16;
  return { fod: d.fod * k[0], ft: d.ft * k[1], wn: d.wn * k[2], so: d.so * k[2], bc: d.bc * k[0], nb, bd: d.bd * (cls > 150 ? 1.15 : 1), od: d.od };
}

function valveLen(p) {
  const d = DIM[p.dn];
  return { gate: d.gate, ball: d.gate, globe: d.globe, check: d.globe, butterfly: d.bfly }[p.sub] * (p.cls > 150 ? 1.25 : 1);

function endFlanges(L, f, r) {
  return [cyl(new V3(0, 0, 0), new V3(f.ft, 0, 0), f.fod / 2), cyl(new V3(L - f.ft, 0, 0), new V3(L, 0, 0), f.fod / 2)];
}
function handwheel(x, h, f, od) {
  return [cyl(new V3(x, 0, 0), new V3(x, h, 0), Math.max(5, od * 0.06), null, { clash: false }),
    arc(new V3(x, h, 0), f.fod * 0.42, Math.max(5, od * 0.045), AX, AZ, Math.PI * 2, ACC),

const TYPE_PREF_UP = { valve: 1, strainer: 1, sightglass: 1, psv: 1, pgauge: 1, tgauge: 1, reducer: 1, tee: 0, elbow: 0 };

/* ---------------- Peças e portas no mundo ---------------- */
function localPorts(pc) { return TYPES[pc.type].ports(pc); }
function worldPt(pc, v) { return pc.q.rot(v).add(pc.pos); }
function worldPorts(pc) {
  const out = {};
  for (const p of localPorts(pc)) out[p.id] = Object.assign({}, p, { pos: worldPt(pc, p.pos), dir: pc.q.rot(p.dir).norm() });
  return out;
}
function worldPort(pc, id) { return worldPorts(pc)[id]; }

/* ---------------- Projeto ---------------- */
class Project {
  constructor() {
    this.pieces = new Map();
    this.seq = {};
    this.meta = { title: 'LINHA DE PROCESSO', line: 'TP-001', sheet: '1/1', designer: '', approver: '', date: new Date().toISOString().slice(0, 10), rev: '0', designP: 10, fstd: 'ASME B16.5', fluid: 'Água industrial' };
    this.fieldWelds = {};
    this.nextId = 1;
  }
  tag(type) { const pre = TYPES[type].prefix; this.seq[pre] = (this.seq[pre] || 0) + 1; return `${pre}-${String(this.seq[pre]).padStart(3, '0')}`; }
  create(type, params) {
    const pc = Object.assign({ id: 'p' + (this.nextId++), type, dn: 100, cls: 150, len: 1000, angle: 90, radius: 'LR', sub: null, pos: new V3(), q: new Q(), conn: {} }, TYPES[type].defaults || {}, params || {});
    if (type === 'valve' && !pc.sub) pc.sub = 'gate';
    if (type === 'flange' && !pc.sub) pc.sub = 'WN';
    if (type === 'reducer' && !pc.dn2) pc.dn2 = nextDown(pc.dn);
    if (type === 'psv' && !pc.dn2) pc.dn2 = nextUp(pc.dn);
    if ((type === 'pgauge' || type === 'tgauge') && !params?.dn) pc.dn = 15;
    pc.tag = pc.tag || this.tag(type);
    for (const p of localPorts(pc)) pc.conn[p.id] = null;
    this.pieces.set(pc.id, pc);
    return pc;
  }
  get(id) { return this.pieces.get(id); }
  remove(id) {
    const pc = this.get(id); if (!pc) return;
    for (const k in pc.conn) { const c = pc.conn[k]; if (c) { const o = this.get(c.id); if (o) o.conn[c.port] = null; } }
    this.pieces.delete(id);
  }
  link(a, ap, b, bp) { a.conn[ap] = { id: b.id, port: bp }; b.conn[bp] = { id: a.id, port: ap }; }
  unlink(a, ap) { const c = a.conn[ap]; if (c) { const o = this.get(c.id); if (o) o.conn[c.port] = null; } a.conn[ap] = null; }
  toJSON() {
    return { v: 1, meta: this.meta, seq: this.seq, nextId: this.nextId, fieldWelds: this.fieldWelds,
      pieces: [...this.pieces.values()].map(p => Object.assign({}, p, { pos: p.pos.arr(), q: p.q.arr() })) };
  }
  static fromJSON(o) {
    const pr = new Project();
    if (!o) return pr;
    Object.assign(pr.meta, o.meta || {}); pr.seq = o.seq || {}; pr.nextId = o.nextId || 1; pr.fieldWelds = o.fieldWelds || {};
    for (const p of o.pieces || []) { const pc = Object.assign({}, p, { pos: V3.of(p.pos), q: Q.of(p.q) }); pr.pieces.set(pc.id, pc); }
    return pr;
  }
}

/* ---------------- Compatibilidade e acoplamento ---------------- */
function compatible(pa, pb, A, B) {
  if (pa.end === 'CV' || pb.end === 'CV') return pa.end === pb.end ? { ok: true } : { ok: false, why: 'peça civil × tubulação' };
  if (Math.abs(pa.od - pb.od) > 0.6) return { ok: false, why: `diâmetros diferentes (Ø${r1(pa.od)} × Ø${r1(pb.od)})` };
  if (pa.end === 'FL' && pb.end === 'FL' && A && B && (A.cls || 150) !== (B.cls || 150)) return { ok: false, why: 'classes de pressão diferentes' };
  const fl = [pa.end, pb.end].filter(e => e === 'FL').length;
  if (fl === 1) return { ok: false, why: 'face flangeada × ponta para solda' };
  return { ok: true };
}
function jointType(ea, eb) {
  if (ea === 'CV' || eb === 'CV') return 'civil';
  if (ea === 'FL' && eb === 'FL') return 'bolted';
  if (ea === 'TH' || eb === 'TH') return 'threaded';
  return 'weld';
}

// Pose que coloca a porta `myPort` da peça exatamente sobre a porta do alvo, face a face.
function snapPose(pc, myPort, tgt, tgtPort, rollDeg = 0) {
  const t = worldPort(tgt, tgtPort);
  const lp = localPorts(pc).find(p => p.id === myPort);
  const m = lp.dir.norm();
  // eixo local de referência perpendicular à porta
  let pl = Math.abs(m.dot(UP)) > 0.99 ? AX : UP;
  pl = pl.sub(m.scale(pl.dot(m))).norm();
  const L = Q.fromBasis(m.neg(), pl, m.neg().cross(pl));
  // referência no mundo
  const d = t.dir.norm();
  let ref;
  if (Math.abs(d.dot(UP)) > 0.99) ref = AX.sub(d.scale(AX.dot(d))).norm();
  else if (TYPE_PREF_UP[pc.type] === 0 && m.dot(AX) < -0.99) ref = UP.cross(d).norm();
  else ref = UP.sub(d.scale(UP.dot(d))).norm();
  const W = Q.fromBasis(d, ref, d.cross(ref));
  let q = W.mul(L.conj());
  if (rollDeg) q = Q.axisAngle(d, rollDeg * D2R).mul(q);
  q = q.normalize();
  const pos = t.pos.sub(q.rot(lp.pos));
  return { pos, q };
}

/* ---------------- Grafo / ramos ---------------- */
function component(pr, id) {
  const seen = new Set([id]), st = [id];
  while (st.length) { const pc = pr.get(st.pop()); for (const k in pc.conn) { const c = pc.conn[k]; if (c && !seen.has(c.id)) { seen.add(c.id); st.push(c.id); } } }
  return seen;
}
function branch(pr, startId, blockedId) {
  const seen = new Set([startId]); if (blockedId) seen.add(blockedId);
  const st = [startId];
  while (st.length) { const pc = pr.get(st.pop()); for (const k in pc.conn) { const c = pc.conn[k]; if (c && !seen.has(c.id)) { seen.add(c.id); st.push(c.id); } } }
  if (blockedId) seen.delete(blockedId);
  return seen;
}
// transformação rígida: p -> newPivot + R(p - oldPivot)
function applyRigid(pr, ids, oldPivot, newPivot, R) {
  for (const id of ids) { const pc = pr.get(id); pc.pos = newPivot.add(R.rot(pc.pos.sub(oldPivot))); pc.q = R.mul(pc.q).normalize(); }
}
function pivotPort(pc) {
  for (const k of Object.keys(pc.conn)) if (pc.conn[k]) return k;
  return Object.keys(pc.conn)[0];
}
// Gira a peça + tudo a jusante em torno da FACE da porta-pivô
function rotateBranch(pr, id, axis, deg, pivotId) {
  const pc = pr.get(id); const piv = pivotId || pivotPort(pc);
  const up = pc.conn[piv] ? pc.conn[piv].id : null;
  const ids = up ? branch(pr, id, up) : component(pr, id);
  const P0 = worldPort(pc, piv).pos;
  if (up && ids.has(up)) return { ok: false, msg: 'Malha fechada: giro bloqueado' };
  applyRigid(pr, ids, P0, P0, Q.axisAngle(axis, deg * D2R));
  return { ok: true, pivot: piv };
}
function flowAxis(pc) { // direção de saída pela porta-pivô
  const piv = pivotPort(pc), w = worldPort(pc, piv);
  return { piv, axis: w.dir.neg(), pos: w.pos };
}
function roll(pr, id, deg) { const pc = pr.get(id); const { axis } = flowAxis(pc); return rotateBranch(pr, id, axis, deg); }
function tilt(pr, id, deg, mode) {
  const pc = pr.get(id); const { axis } = flowAxis(pc);
  let ax;
  if (mode === 'h') ax = UP;
  else { ax = axis.cross(UP); if (ax.len() < 1e-6) ax = AX; }
  return rotateBranch(pr, id, ax.norm(), deg);
}
// Alinha a peça: 'up' (em pé) | 'flat' (deitado)
function orient(pr, id, mode) {
  const pc = pr.get(id); const { axis } = flowAxis(pc);
  let target;
  if (mode === 'up') target = UP;
  else { target = new V3(axis.x, 0, axis.z); if (target.len() < 1e-6) target = AX; }
  const R = Q.fromUnitVectors(axis, target.norm());
  const piv = pivotPort(pc), upId = pc.conn[piv]?.id;
  const ids = upId ? branch(pr, id, upId) : component(pr, id);
  const P0 = worldPort(pc, piv).pos;
  applyRigid(pr, ids, P0, P0, R);
}
function moveGroup(pr, id, delta) { for (const i of component(pr, id)) { const pc = pr.get(i); pc.pos = pc.pos.add(delta); } }

// Altera parâmetros mantendo a porta-pivô fixa e arrastando os ramos das outras portas
function updateParams(pr, id, mutate) {
  const pc = pr.get(id);
  const piv = pivotPort(pc);
  const before = worldPorts(pc);
  mutate(pc);
  // portas que deixaram de existir
  const lp = localPorts(pc).map(p => p.id);
  for (const k of Object.keys(pc.conn)) if (!lp.includes(k)) { pr.unlink(pc, k); delete pc.conn[k]; }
  for (const k of lp) if (!(k in pc.conn)) pc.conn[k] = null;
  // re-fixa pivô
  const nowPiv = worldPort(pc, piv);
  if (nowPiv && before[piv]) pc.pos = pc.pos.add(before[piv].pos.sub(nowPiv.pos));
  const after = worldPorts(pc);
  for (const k of lp) {
    if (k === piv || !pc.conn[k] || !before[k]) continue;
    const c = pc.conn[k];
    const R = Q.fromUnitVectors(before[k].dir, after[k].dir);
    applyRigid(pr, branch(pr, c.id, pc.id), before[k].pos, after[k].pos, R);
  }
}

function autoConnect(pr, tol = 0.6) {
  const open = [];
  for (const pc of pr.pieces.values()) { const w = worldPorts(pc); for (const k in w) if (!pc.conn[k]) open.push({ pc, p: w[k] }); }
  let n = 0;
  for (let i = 0; i < open.length; i++) for (let j = i + 1; j < open.length; j++) {
    const a = open[i], b = open[j];
    if (a.pc === b.pc || a.pc.conn[a.p.id] || b.pc.conn[b.p.id]) continue;
    if (a.p.pos.dist(b.p.pos) <= tol && a.p.dir.dot(b.p.dir) < -0.999 && compatible(a.p, b.p, a.pc, b.pc).ok) { pr.link(a.pc, a.p.id, b.pc, b.p.id); n++; }
  }
  return n;
}

// "Acoplar": encontra a porta livre compatível mais próxima e encaixa o grupo da peça
function acoplar(pr, id, maxDist = 3000) {
  const pc = pr.get(id), mine = worldPorts(pc), comp = component(pr, id);
  let best = null;
  for (const k in mine) {
    if (pc.conn[k]) continue;
    for (const o of pr.pieces.values()) {
      if (comp.has(o.id)) continue;
      const w = worldPorts(o);
      for (const ok in w) {
        if (o.conn[ok]) continue;
        const c = compatible(mine[k], w[ok], pc, o);
        const d = mine[k].pos.dist(w[ok].pos);
        if (d > maxDist) continue;
        if (!c.ok) { if (!best || best.bad) best = { bad: c.why, d }; continue; }
        if (!best || best.bad || d < best.d) best = { k, o, ok, d };
      }
    }
  }
  if (!best || best.bad) return { ok: false, msg: best ? `Não compatível: ${best.bad}` : 'Nenhuma porta livre por perto' };
  const pose = snapPose(pc, best.k, best.o, best.ok);
  const R = pose.q.mul(pc.q.conj()).normalize();
  const oldP = pc.pos;
  applyRigid(pr, comp, oldP, pose.pos, R);
  pr.link(pc, best.k, best.o, best.ok);
  autoConnect(pr);
  return { ok: true, msg: `Acoplado em ${best.o.tag} (${best.ok})` };
}

/* ---------------- Detecção de interferências (cápsulas 3D) ---------------- */
function segSegDist(p1, q1, p2, q2) {
  const d1 = q1.sub(p1), d2 = q2.sub(p2), r = p1.sub(p2);
  const a = d1.dot(d1), e = d2.dot(d2), f = d2.dot(r);
  let s, t;
  if (a <= 1e-9 && e <= 1e-9) return p1.dist(p2);
  if (a <= 1e-9) { s = 0; t = Math.min(1, Math.max(0, f / e)); }
  else {
    const c = d1.dot(r);
    if (e <= 1e-9) { t = 0; s = Math.min(1, Math.max(0, -c / a)); }
    else {
      const b = d1.dot(d2), den = a * e - b * b;

}

      `<span class="sep"></span><button class="ib sm ${st.skew ? 'on' : ''}" id="iSkew" title="Permite trechos fora dos eixos">Inclinado</button>

      <span class="sep"></span><button class="ib sm" id="iUndo">↶</button><button class="ib sm" id="iClr">Limpar</button><button class="ib sm" id="iCenter">Centralizar</button><button class="ib sm am" id="iConv">Converter para 3D</button>`;

    $('#iSkew').onclick = () => { st.skew = !st.skew; persist(); bar(); };
    $('#iPlane').onchange = e => { st.plane = e.target.value; persist(); };
    $('#iGrid').onchange = e => { st.grid = Math.max(10, +e.target.value || 100); persist(); draw(); };
    $('#iDn').onchange = e => { st.dn = +e.target.value; persist(); };
    $('#iUndo').onclick = () => { if (!hist.length) return; fut.push(JSON.stringify([st.segs, st.strokes, st.ells])); [st.segs, st.strokes, st.ells] = JSON.parse(hist.pop()); persist(); draw(); };
    $('#iClr').onclick = () => { if (!st.segs.length && !st.strokes.length && !st.ells.length) return; push(); st.segs = []; st.strokes = []; st.ells = []; persist(); draw(); toast('Desenho limpo (↶ desfaz).'); };
    $('#iCenter').onclick = center;
    $('#iConv').onclick = convert;
  }
  function center() {

    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const w = Math.max(...xs) - Math.min(...xs) || 1, h = Math.max(...ys) - Math.min(...ys) || 1;

  function resize() { const r = $('#viso').getBoundingClientRect(); dpr = Math.min(2, window.devicePixelRatio || 1); W = r.width; H = r.height; if (!W) return; cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px'; draw(); }
  function snapEnd(a, wpt) {

      if (drag.tool === 'free' && drag.pts.length > 2) { push(); st.strokes.push(drag.pts.filter((p, i) => i % 2 === 0)); }

  function distSeg(p, a, b) { const dx = b[0] - a[0], dy = b[1] - a[1], l = dx * dx + dy * dy || 1; const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / l)); return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy); }

      for (let b = Math.ceil(b0 / step) * step; b <= b1; b += step) line(TP.latticeToScreen(a0, b), TP.latticeToScreen(a1, b), b % 10 === 0 ? '#2b313b' : '#1a1e25');
      for (let a = Math.ceil(a0 / step) * step; a <= a1; a += step) line(TP.latticeToScreen(a, b0), TP.latticeToScreen(a, b1), a % 10 === 0 ? '#2b313b' : '#1a1e25');
      const x0 = toW(0, 0)[0] / C30, x1 = toW(W, 0)[0] / C30;
      for (let m = Math.floor(x0 / step) * step; m <= x1; m += step) { const x = m * C30 * st.view.k + st.view.x; ctx.strokeStyle = m % 10 === 0 ? '#2b313b' : '#1a1e25'; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    }
    // eixos de referência
    const o = toS([0, 0]);
    [['E', '#ef4444'], ['N', '#3b82f6'], ['Cima', '#22c55e']].forEach(([n, c]) => { const ax = TP.ISO_AXES.find(a => a.n === n); ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(o[0], o[1]); ctx.lineTo(o[0] + ax.s[0] * 40, o[1] + ax.s[1] * 40); ctx.stroke(); ctx.fillStyle = c; ctx.font = '11px IBM Plex Mono, monospace'; ctx.fillText(n, o[0] + ax.s[0] * 46 - 4, o[1] + ax.s[1] * 46 + 4); });
    // rabiscos e elipses
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = '#9aa3ad'; ctx.lineWidth = 1.6;
    for (const s of st.strokes.concat(drag && drag.tool === 'free' ? [drag.pts] : [])) { ctx.beginPath(); s.forEach((p, i) => { const q = toS(p); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }); ctx.stroke(); }
    for (const e of st.ells.concat(drag && drag.tool === 'ell' && drag.r ? [{ c: drag.c, r: drag.r, plane: st.plane }] : [])) { ctx.beginPath(); ellPts(e).forEach((p, i) => { const q = toS(p); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); }); ctx.stroke(); }
    // trechos de tubulação
    const segs = st.segs.concat(preview ? [Object.assign({ prev: true, plane: st.skew ? st.plane : 'EN' }, preview)] : []);
    for (const s of segs) {
      const a = toS(s.a), b = toS(s.b);
      ctx.strokeStyle = s.prev ? '#fbbf24' : '#f59e0b'; ctx.lineWidth = s.prev ? 3 : 4; ctx.setLineDash(s.prev ? [8, 6] : []);

      let ang = Math.atan2(b[1] - a[1], b[0] - a[0]); if (ang > Math.PI / 2) ang -= Math.PI; if (ang < -Math.PI / 2) ang += Math.PI;
      ctx.save(); ctx.translate((a[0] + b[0]) / 2, (a[1] + b[1]) / 2); ctx.rotate(ang); ctx.fillStyle = '#e5e7eb'; ctx.font = '600 11px IBM Plex Mono, monospace'; ctx.textAlign = 'center';
      ctx.fillText(`${fmt(inf.L)}${inf.axis === 'skew' ? ' ∠' : ''}`, 0, -8); ctx.restore();
    }
    ctx.fillStyle = '#f59e0b';
    for (const s of st.segs) for (const p of [s.a, s.b]) { const q = toS(p); ctx.beginPath(); ctx.arc(q[0], q[1], 3.5, 0, 7); ctx.fill(); }
    if (cursor && (st.tool === 'line' || st.tool === 'ell')) { const q = toS(cursor); ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(q[0], q[1], 6, 0, 7); ctx.stroke(); }
  }
  function convert() {
    if (!st.segs.length) { toast('Desenhe trechos com a ferramenta Linha primeiro.', 'er'); return; }
    let res;
    mutate(() => {
      const conv = TP.isoTo3D(st.segs, st.grid);

    const n = { pipe: 0, elbow: 0, tee: 0 }; res.created.forEach(p => n[p.type]++);
    toast(`Convertido: ${n.pipe} tubos, ${n.elbow} curvas, ${n.tee} tês — todos acoplados.`, 'ok');
    res.warnings.forEach(w => toast(w, 'er'));
    setTab('3d'); setTimeout(() => R.fit(), 60);

})();

(function () {

const CONFIG = {

  supabaseAnonKey: 'sb_publishable_SrU1vt-msmTT4I4DU-IIpA_bYGp6A15',

const MODULES = { TB: 'Tubulação', CL: 'Construção civil', EL: 'Eletromecânico', ES: 'Estruturas metálicas', HV: 'HVAC / Dutos' };

function packageName(mods) {

const ROLE_L = { admin: 'Administrador', moderator: 'Moderador', client: 'Cliente' };
const STATUS_L = { nova: 'Nova', negociacao: 'Em negociação', liberada: 'Liberada', recusada: 'Recusada' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const low = s => String(s || '').trim().toLowerCase();
const daysLeft = g => g.expires_at ? Math.ceil((new Date(g.expires_at) - Date.now()) / 864e5) : null;
const isValid = g => g && g.active && (g.role !== 'client' || !g.expires_at || new Date(g.expires_at) > new Date());
const dt = s => s ? new Date(s).toLocaleDateString('pt-BR') : '—';
function toast(msg, kind = '') { const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg; $('#toast').appendChild(t); setTimeout(() => t.remove(), kind === 'er' ? 5200 : 3400); }

// regras de quem pode mexer em quem (repetidas no servidor pelo SQL)
function canEdit(actor, target) {
  if (!actor || !target) return false;
  if (low(target.email) === CONFIG.superAdmin) return false;
  if (actor.role === 'admin') return true;
  if (actor.role === 'moderator') return target.role === 'client';

}

/* ---------------- Backend: demonstração (localStorage) ---------------- */
const Demo = (() => {
  const K = 'tecplan.demo.db.v1', KS = 'tecplan.demo.session';
  const get = () => { try { return JSON.parse(localStorage.getItem(K)) || null; } catch { return null; } };
  const put = d => { try { localStorage.setItem(K, JSON.stringify(d)); } catch { } };
  let db = get();
  if (!db) {
    const now = Date.now();
    db = {
      grants: [
        { email: CONFIG.superAdmin, name: 'Gabriel Corrêa', role: 'admin', modules: ALL, package: 'Master Premium', expires_at: null, active: true, created_at: new Date(now).toISOString() },
        { email: 'moderador@demo.com', name: 'Moderador Demo', role: 'moderator', modules: ['TB'], package: 'TB.Max', expires_at: null, active: true, created_at: new Date(now).toISOString() },
        { email: 'cliente@demo.com', name: 'Cliente Demo', company: 'Metalúrgica Exemplo', role: 'client', modules: ['TB'], package: 'TB.Max', expires_at: new Date(now + 30 * 864e5).toISOString(), active: true, created_at: new Date(now).toISOString() },
        { email: 'civil@demo.com', name: 'Construtora Demo', role: 'client', modules: ['CL'], package: 'CL.Max', expires_at: new Date(now + 7 * 864e5).toISOString(), active: true, created_at: new Date(now).toISOString() },
      ],
      pw: { [CONFIG.superAdmin]: 'demo', 'moderador@demo.com': 'demo', 'cliente@demo.com': 'demo', 'civil@demo.com': 'demo' },
      leads: [{ id: 'l1', name: 'João Silva', company: 'Caldeiraria Silva', whatsapp: '(11) 98888-7777', email: 'joao@exemplo.com', interests: ['TB'], message: 'Preciso gerar spools e BOM para uma linha de vapor.', consent: true, status: 'nova', created_at: new Date(now - 36e5).toISOString() }],
    };
    put(db);
  }
  const me = () => { try { const e = localStorage.getItem(KS); return e ? db.grants.find(g => g.email === e) || null : null; } catch { return null; } };
  return {
    demo: true,
    async session() { return me(); },
    async signIn(email, pw) { email = low(email); const g = db.grants.find(x => x.email === email); if (!g || db.pw[email] !== pw) throw new Error('E-mail ou senha incorretos'); localStorage.setItem(KS, email); return g; },
    async signUp(email, pw) { email = low(email); const g = db.grants.find(x => x.email === email && x.active); if (!g) throw new Error('Este e-mail ainda não tem acesso liberado. Use o formulário abaixo para falar com a gente.'); if (db.pw[email]) throw new Error('Esse e-mail já tem senha. Use "Entrar".'); db.pw[email] = pw; put(db); localStorage.setItem(KS, email); return { user: g }; },
    async reset() { return 'Modo demonstração: a senha das contas de exemplo é "demo".'; },
    async signOut() { try { localStorage.removeItem(KS); } catch { } },
    async submitLead(l) { db.leads.unshift(Object.assign({ id: 'l' + Date.now(), status: 'nova', created_at: new Date().toISOString() }, l)); put(db); },

    async updateLead(id, patch) { const l = db.leads.find(x => x.id === id); Object.assign(l, patch); put(db); },
    async deleteLead(id) { db.leads = db.leads.filter(x => x.id !== id); put(db); },

      if (old) Object.assign(old, g, { updated_at: new Date().toISOString() });
      else db.grants.push(Object.assign({ created_at: new Date().toISOString(), created_by: actor.email }, g));
      put(db);
    },
    async deleteGrant(email, actor) { const g = db.grants.find(x => x.email === email); if (!canEdit(actor, g) || actor.role !== 'admin') throw new Error('Somente o administrador remove acessos'); db.grants = db.grants.filter(x => x.email !== email); delete db.pw[email]; put(db); },
    async listProjects() { const e = me()?.email; return Object.values((db.projects || {})[e] || {}).map(({ id, name, updated_at }) => ({ id, name, updated_at })).sort((a, b) => b.updated_at.localeCompare(a.updated_at)); },
    async getProject(id) { const e = me()?.email; return ((db.projects || {})[e] || {})[id] || null; },
    async saveProject(p) { const e = me()?.email; if (!e) throw new Error('sem sessão'); db.projects = db.projects || {}; db.projects[e] = db.projects[e] || {}; const r = { id: p.id, name: p.name, data: p.data, updated_at: new Date().toISOString() }; db.projects[e][p.id] = r; put(db); return { id: r.id, updated_at: r.updated_at }; },
    async deleteProject(id) { const e = me()?.email; if (db.projects && db.projects[e]) delete db.projects[e][id]; put(db); },
    resetDemo() { try { localStorage.removeItem(K); localStorage.removeItem(KS); } catch { } },
  };
})();

/* ---------------- Backend: Supabase ---------------- */
function SupabaseBackend(sb) {
  const grantOf = async email => { const { data, error } = await sb.from('access_grants').select('*').eq('email', low(email)).maybeSingle(); if (error) throw error; return data; };
  return {
    demo: false,
    async session() { const { data } = await sb.auth.getSession(); const u = data.session?.user; return u ? await grantOf(u.email) : null; },
    async signIn(email, pw) { const { data, error } = await sb.auth.signInWithPassword({ email: low(email), password: pw }); if (error) throw new Error(error.message.includes('Invalid') ? 'E-mail ou senha incorretos' : error.message); return await grantOf(data.user.email); },
    async signUp(email, pw) {
      const { data: ok, error: e1 } = await sb.rpc('grant_exists', { p_email: low(email) });
      if (e1) throw e1; if (!ok) throw new Error('Este e-mail ainda não tem acesso liberado. Use o formulário abaixo para falar com a gente.');
      const { data, error } = await sb.auth.signUp({ email: low(email), password: pw, options: { emailRedirectTo: location.href.split('#')[0] } });
      if (error) throw new Error(error.message);
      if (!data.session) return { confirm: true };
      return { user: await grantOf(email) };
    },
    async reset(email) { const { error } = await sb.auth.resetPasswordForEmail(low(email), { redirectTo: location.href.split('#')[0] }); if (error) throw error; return 'Se o e-mail tiver acesso, enviamos um link para criar uma nova senha.'; },
    async signOut() { await sb.auth.signOut(); },
    async submitLead(l) { const { error } = await sb.from('leads').insert(l); if (error) throw new Error('Não foi possível enviar agora. Tente de novo em instantes.'); },
    async listLeads() { const { data, error } = await sb.from('leads').select('*').order('created_at', { ascending: false }); if (error) throw error; return data; },
    async updateLead(id, patch) { const { error } = await sb.from('leads').update(patch).eq('id', id); if (error) throw error; },
    async deleteLead(id) { const { error } = await sb.from('leads').delete().eq('id', id); if (error) throw error; },
    async listGrants() { const { data, error } = await sb.from('access_grants').select('*').order('created_at'); if (error) throw error; return data; },
    async saveGrant(g) { g.email = low(g.email); const { error } = await sb.from('access_grants').upsert(g, { onConflict: 'email' }); if (error) throw new Error(error.message); },
    async deleteGrant(email) { const { error } = await sb.from('access_grants').delete().eq('email', email); if (error) throw new Error(error.message); },
    async listProjects() { const { data, error } = await sb.from('projects').select('id,name,updated_at').order('updated_at', { ascending: false }); if (error) throw error; return data; },

    const c = add('pipe', { dn: 100, len: 900 }, e2, 'P2'), e3 = add('elbow', { dn: 100 }, c, 'P2'); roll(p1, e3.id, 90);

    const br = add('pipe', { dn: 50, len: 300 }, t, 'P3'), fb = add('flange', { dn: 50 }, br, 'P2'); add('valve', { dn: 50, sub: 'ball' }, fb, 'P2'); }
  // 2) Coletor com três saídas
  const p2 = mk(); { const add = chain(p2);
    let prev = add('flange', { dn: 150, sub: 'BL' }); let port = 'P1';
    const w = add('flange', { dn: 150 }, prev, 'P1', 'P2'); prev = w; port = 'P1';
    for (let i = 0; i < 3; i++) {
      const pp = add('pipe', { dn: 150, len: 450 }, prev, port), te = add('tee', { dn: 150, dn2: 80 }, pp, 'P2'); roll(p2, te.id, 90);
      const s = add('pipe', { dn: 80, len: 350 }, te, 'P3'), fl = add('flange', { dn: 80 }, s, 'P2'), vv = add('valve', { dn: 80, sub: i === 1 ? 'globe' : 'gate' }, fl, 'P2'); add('flange', { dn: 80 }, vv, 'P2', 'P2');

let ATAB = 'leads', LFILTER = 'abertas';
async function renderAdmin() {
  const a = $('#adm'); a.innerHTML = '<div class="aw"><div class="mut">Carregando…</div></div>';
  let leads = [], grants = [];
  try { [leads, grants] = await Promise.all([B.listLeads(), B.listGrants()]); } catch (e) { a.innerHTML = `<div class="aw"><div class="err">Erro ao carregar: ${esc(e.message)}</div></div>`; return; }
  const open = leads.filter(l => l.status === 'nova' || l.status === 'negociacao');
  const shownLeads = LFILTER === 'abertas' ? open : leads;
  const wa = n => { const d = String(n || '').replace(/\D/g, ''); return d ? `https://wa.me/${d.length <= 11 ? '55' + d : d}` : null; };
  const leadCard = l => `<div class="lc"><div class="hd"><div><b>${esc(l.name)}</b>${l.company ? ` <span class="mut">· ${esc(l.company)}</span>` : ''}<div class="mut" style="font-size:11.5px">${new Date(l.created_at).toLocaleString('pt-BR')}</div></div>
      <select class="in" data-ls="${l.id}" style="width:auto">${Object.entries(STATUS_L).map(([k, v]) => `<option value="${k}" ${l.status === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
    <div class="ct">${l.whatsapp ? `<a href="${wa(l.whatsapp)}" target="_blank" rel="noopener">WhatsApp ${esc(l.whatsapp)}</a>` : ''}${l.email ? `<span>${esc(l.email)}</span>` : ''}${l.other_contact ? `<span>${esc(l.other_contact)}</span>` : ''}</div>
    <div class="chk" style="margin-bottom:6px">${(l.interests || []).map(k => `<span class="chip am">${esc(MODULES[k] || k)}</span>`).join('')}</div>
    ${l.message ? `<div style="font-size:13px;margin-bottom:8px">${esc(l.message)}</div>` : ''}
    <div class="row"><input class="in" data-ln="${l.id}" placeholder="Anotações internas" value="${esc(l.notes || '')}" style="flex:1"><button class="ib am" data-lg="${l.id}">Liberar acesso</button>${ME.role === 'admin' ? `<button class="ib" data-ld="${l.id}" title="Excluir">✕</button>` : ''}</div></div>`;
  const gRow = g => { const d = daysLeft(g), ok = isValid(g), ed = canEdit(ME, g);
    return `<tr><td><b>${esc(g.name || '—')}</b><div class="mut mono" style="font-size:11px">${esc(g.email)}</div></td><td>${ROLE_L[g.role]}</td><td><span class="chip am">${esc(g.package || packageName(g.modules || []))}</span></td>
    <td class="n">${g.role !== 'client' ? '—' : g.expires_at ? `${dt(g.expires_at)}<div class="mut" style="font-size:11px">${d > 0 ? d + ' dias' : 'vencido'}</div>` : 'sem validade'}</td>
    <td><span class="chip ${ok ? 'ok' : 'er'}">${ok ? 'ativo' : g.active ? 'vencido' : 'suspenso'}</span></td>
    <td>${ed ? `<button class="ib sm" data-ge="${esc(g.email)}">Editar</button>` : `<span class="mut" style="font-size:11px">${low(g.email) === CONFIG.superAdmin ? 'protegido' : '—'}</span>`}</td></tr>`; };
  a.innerHTML = `<div class="aw">
    <div class="row" style="justify-content:space-between;flex-wrap:wrap;margin-bottom:12px"><div class="gtabs" style="margin:0;min-width:280px"><button data-at="leads" class="${ATAB === 'leads' ? 'on' : ''}">Solicitações (${open.length})</button><button data-at="grants" class="${ATAB === 'grants' ? 'on' : ''}">Acessos (${grants.length})</button></div>
    <div class="row">${B.demo ? '<span class="chip">modo demonstração</span>' : '<span class="chip ok">Supabase</span>'}<button class="ib" id="admClose">Fechar painel</button></div></div>
    ${ATAB === 'leads' ? `<div class="row" style="margin-bottom:10px"><button class="ib sm ${LFILTER === 'abertas' ? 'on' : ''}" data-lf="abertas">Em aberto</button><button class="ib sm ${LFILTER === 'todas' ? 'on' : ''}" data-lf="todas">Todas</button></div>${shownLeads.map(leadCard).join('') || '<div class="mut">Nenhuma solicitação aqui.</div>'}`
      : `<div class="row" style="margin-bottom:10px"><button class="ib am" id="gNew">+ Novo acesso</button><span class="mut" style="font-size:12px">${ME.role === 'moderator' ? 'Como moderador, você gerencia apenas clientes.' : 'O administrador principal é protegido e não pode ser alterado.'}</span></div>
      <div class="tw"><table class="t"><thead><tr><th>Usuário</th><th>Papel</th><th>Pacote</th><th>Validade</th><th>Status</th><th></th></tr></thead><tbody>${grants.map(gRow).join('')}</tbody></table></div>`}
  </div>`;
  a.querySelectorAll('[data-at]').forEach(b => b.onclick = () => { ATAB = b.dataset.at; renderAdmin(); });
  a.querySelectorAll('[data-lf]').forEach(b => b.onclick = () => { LFILTER = b.dataset.lf; renderAdmin(); });
  $('#admClose').onclick = () => { a.classList.remove('on'); $('#bAdm').classList.remove('on'); };
  a.querySelectorAll('[data-ls]').forEach(s => s.onchange = async () => { try { await B.updateLead(s.dataset.ls, { status: s.value, handled_by: ME.email }); toast('Status atualizado.', 'ok'); renderAdmin(); } catch (e) { toast(e.message, 'er'); } });
  a.querySelectorAll('[data-ln]').forEach(i => i.onchange = async () => { try { await B.updateLead(i.dataset.ln, { notes: i.value, handled_by: ME.email }); toast('Anotação salva.', 'ok'); } catch (e) { toast(e.message, 'er'); } });
  a.querySelectorAll('[data-ld]').forEach(b => b.onclick = () => confirmBox('Excluir solicitação?', 'Essa ação não pode ser desfeita.', 'Excluir', async () => { try { await B.deleteLead(b.dataset.ld); renderAdmin(); } catch (e) { toast(e.message, 'er'); } }));
  a.querySelectorAll('[data-lg]').forEach(b => b.onclick = () => { const l = leads.find(x => x.id === b.dataset.lg); const ex = grants.find(g => low(g.email) === low(l.email)); grantEditor(ex || { email: l.email || '', name: l.name, company: l.company, role: 'client', modules: l.interests && l.interests.length ? l.interests : ['TB'], active: true }, l); });
  if ($('#gNew')) $('#gNew').onclick = () => grantEditor({ email: '', role: 'client', modules: ['TB'], active: true });
  a.querySelectorAll('[data-ge]').forEach(b => b.onclick = () => grantEditor(Object.assign({}, grants.find(g => g.email === b.dataset.ge)), null, true));
}
function grantEditor(g, lead, editing) {
  const m = document.createElement('div'); m.className = 'modal';
  const d = daysLeft(g);
  const expDate = g.expires_at ? g.expires_at.slice(0, 10) : '';
  m.innerHTML = `<div class="box"><h3 style="margin:0 0 4px">${editing ? 'Editar acesso' : 'Liberar acesso'}</h3>${lead ? `<div class="mut" style="margin-bottom:8px">Solicitação de ${esc(lead.name)}</div>` : ''}
    <form class="gform" id="gef">
      <label class="f">E-mail de acesso *<input class="in" name="email" type="email" value="${esc(g.email)}" ${editing ? 'readonly' : ''} required></label>
      <div class="grid2"><label class="f">Nome<input class="in" name="name" value="${esc(g.name || '')}"></label><label class="f">Empresa<input class="in" name="company" value="${esc(g.company || '')}"></label></div>
      <label class="f">Papel<select class="in" name="role"><option value="client">Cliente</option>${ME.role === 'admin' ? `<option value="moderator" ${g.role === 'moderator' ? 'selected' : ''}>Moderador</option>` : ''}</select></label>
      <div><div class="mut" style="font-size:11px;margin-bottom:5px">Módulos liberados</div><div class="chk">${Object.entries(MODULES).map(([k, v]) => `<label><input type="checkbox" name="mod" value="${k}" ${(g.modules || []).includes(k) ? 'checked' : ''}>${v}</label>`).join('')}</div></div>
      <label class="f">Nome do pacote<input class="in" name="package" value="${esc(g.package || packageName(g.modules || []))}"></label>
      <div class="grid2"><label class="f">Validade<select class="in" name="dur"><option value="">Manter / data abaixo</option><option value="7">Teste 7 dias</option><option value="30">30 dias</option><option value="90">90 dias</option><option value="180">6 meses</option><option value="365">1 ano</option><option value="none">Sem validade</option></select></label>
        <label class="f">Vence em<input class="in" name="exp" type="date" value="${expDate}"></label></div>
      ${editing ? `<div class="mut" style="font-size:12px">${d === null ? 'Sem validade' : d > 0 ? `Restam ${d} dias` : 'Vencido'}</div>` : ''}
      <label class="consent"><input type="checkbox" name="active" ${g.active !== false ? 'checked' : ''}>Acesso ativo</label>
      <label class="f">Notas<input class="in" name="notes" value="${esc(g.notes || '')}"></label>
      <div class="err" id="geerr"></div>
      <div class="btns"><button type="button" class="ib" data-x>Cancelar</button>${editing && ME.role === 'admin' ? '<button type="button" class="ib" id="geDel" style="color:var(--er)">Remover</button>' : ''}<button class="ib am" type="submit">${editing ? 'Salvar' : 'Liberar acesso'}</button></div>
    </form></div>`;
  document.body.appendChild(m);
  const f = m.querySelector('#gef');
  const autoPkg = () => { const mods = [...f.querySelectorAll('[name=mod]:checked')].map(i => i.value); if (!f.package.dataset.touched) f.package.value = packageName(mods); };
  f.package.oninput = () => { f.package.dataset.touched = 1; };
  f.querySelectorAll('[name=mod]').forEach(i => i.onchange = autoPkg);
  f.dur.onchange = () => { const v = f.dur.value; if (v === 'none') f.exp.value = ''; else if (v) f.exp.value = new Date(Date.now() + +v * 864e5).toISOString().slice(0, 10); };
  if (!editing && !g.expires_at) { f.dur.value = '30'; f.dur.onchange(); }
  m.onclick = e => { if (e.target === m || e.target.dataset.x !== undefined) m.remove(); };
  if (m.querySelector('#geDel')) m.querySelector('#geDel').onclick = () => confirmBox('Remover acesso?', `${esc(g.email)} perde o acesso imediatamente.`, 'Remover', async () => { try { await B.deleteGrant(g.email, ME); m.remove(); toast('Acesso removido.', 'ok'); renderAdmin(); } catch (e) { toast(e.message, 'er'); } });
  f.onsubmit = async e => {
    e.preventDefault(); const er = m.querySelector('#geerr'); er.textContent = '';
    const out = { email: low(f.email.value), name: f.name.value.trim() || null, company: f.company.value.trim() || null, role: f.role.value, modules: [...f.querySelectorAll('[name=mod]:checked')].map(i => i.value), package: f.package.value.trim() || null, expires_at: f.exp.value ? new Date(f.exp.value + 'T23:59:59').toISOString() : null, active: f.active.checked, notes: f.notes.value.trim() || null };
    if (!/^\S+@\S+\.\S+$/.test(out.email)) { er.textContent = 'E-mail inválido.'; return; }
    if (out.email === CONFIG.superAdmin) { er.textContent = 'Esse é o administrador principal.'; return; }
    if (!out.modules.length) { er.textContent = 'Marque pelo menos um módulo.'; return; }
    try {
      await B.saveGrant(out, ME);
      if (lead) await B.updateLead(lead.id, { status: 'liberada', handled_by: ME.email });
      m.remove(); renderAdmin();
      toast(editing ? 'Acesso atualizado.' : `Acesso liberado para ${out.email}. ${B.demo ? 'No modo demo, a pessoa cria a senha em "Primeiro acesso".' : 'Envie a ela o link do app: ela cria a senha em "Primeiro acesso".'}`, 'ok');
    } catch (err) { er.textContent = err.message; }
  };
}

/* ---------------- Início ---------------- */
async function boot() {
  const st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
  B = await backend();
  let g = null; try { g = await B.session(); } catch (e) { console.error(e); }
  if (g) enter(g); else showGate();
}
window.TPAuth = { MODULES, packageName, CONFIG };
if (typeof THREE !== 'undefined') boot();
})();

</script>
</body>
</html>
